services:
  - type: web
    name: price-tracker-api
    runtime: python
    rootDir: backend
    buildCommand: "./build.sh"
    startCommand: "gunicorn core.wsgi:application --bind 0.0.0.0:$PORT --workers 1 --timeout 120"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://PLACEHOLDER_VERCEL_URL"   # Actualizar con URL real de Vercel tras el deploy
      - key: DATABASE_URL
        sync: false   # Pegar la URL de Supabase en el dashboard de Render
      - key: EMAIL_HOST_USER
        value: "preciosmonitor@gmail.com"
      - key: EMAIL_HOST_PASSWORD
        sync: false   # Pegar el App Password de Gmail en el dashboard de Render
      - key: PYTHON_VERSION
        value: "3.11.0"
